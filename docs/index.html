<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY</title><style>body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui}.top{padding:18px max(20px,calc((100vw - 1180px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.muted{font-size:11px;color:#718078;letter-spacing:.08em}.hero,.tf,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.hero{padding-bottom:26px;border-bottom:1px solid #ddd}.price{font-size:52px;font-weight:800}.regime{font-size:32px;font-weight:800;color:#153e31}.up{color:#147b51}.down{color:#bb533e}.box{padding:16px;background:#fcfcf9;border:1px solid #dfe1dc}.cards{grid-template-columns:repeat(4,1fr);margin-top:10px}.card{border-top:3px solid #4ca87e}.card strong{display:block;font-size:21px;margin:8px 0}.section{margin-top:28px}.error{color:#bb533e}@media(max-width:720px){.hero,.tf,.cards{grid-template-columns:1fr}}</style><body><div class="top">FX / Vector JPY <span class="muted" style="float:right">USDJPY MARKET STATE</span></div><main class="wrap" id="app">Loading market data…</main><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',a=n=>n>15?'↑':n<-15?'↓':'→',c=n=>n>15?'up':n<-15?'down':'',f=s=>s.replaceAll('_',' ').toUpperCase();async function load(){try{let d=await fetch(API).then(r=>r.ok?r.json():Promise.reject()),g=k=>d.indicators.filter(x=>x.category===k).map(x=>`<article class="box card ${c(x.score)}"><span class="muted">${x.name}</span><strong>${a(x.score)} ${x.displayValue}</strong><div>${f(x.direction)}</div><small>${x.description}</small></article>`).join('');app.innerHTML=`<section class="hero"><div><div class="muted">USD / JPY · SPOT FX</div><div class="price">${d.quote.price.toFixed(3)}</div><div class="${c(d.quote.change)}">${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} · ${d.quote.changePercent.toFixed(2)}%</div></div><div><div class="muted">CURRENT REGIME · 4H FOCUS</div><div class="regime">${f(d.composite.regime)}</div><div>${d.composite.modifiers.map(f).join(' · ')}</div></div><div><div class="muted">TREND SCORE</div><div class="price ${c(d.composite.score)}">${d.composite.score>0?'+':''}${d.composite.score}</div>Confidence ${d.composite.confidence}%</div></section><section class="tf" style="margin-top:22px">${d.timeframes.map(x=>`<div class="box ${c(x.score)}"><span class="muted">${x.timeframe}</span><b>${a(x.score)} ${f(x.direction)}</b><br>Score ${x.score}</div>`).join('')}</section><section class="section"><div class="muted">MARKET READ</div><p>${d.summary}</p></section>${['momentum','trend','structure','overextension','volatility'].map(x=>`<section class="section"><div class="muted">${x==='structure'?'MARKET STRUCTURE · MSB / ORDER BLOCK':x.toUpperCase()}</div><div class="cards">${g(x)}</div></section>`).join('')}`}catch{app.innerHTML='<p class="error">Market data is temporarily unavailable. Retrying…</p>'}}load();setInterval(load,15000)</script></body></html>

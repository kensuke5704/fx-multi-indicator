<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f8f3;color:#101612;font:14px Arial,sans-serif}.bar{height:54px;background:#0b0f0c;color:#f7f8f1;display:flex;align-items:center;padding:0 20px;font:700 13px ui-monospace,monospace;letter-spacing:.05em}.meta{margin-left:auto;color:#929a92;font-size:10px}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 54px)}.side{border-right:1px solid #202920;padding:16px 0}.side a{display:block;padding:15px 24px;color:#344038;text-decoration:none;font-size:14px}.side a.on{color:#1f7045;background:#f2f5ee;border-left:4px solid #277445;padding-left:20px;font-weight:700}.main{min-width:0}.head{padding:16px 18px;border-bottom:1px solid #1d2a20;font-size:18px;font-weight:800}.signal{display:grid;grid-template-columns:1.1fr 1.2fr .7fr;border-bottom:1px solid #1d2a20}.signal>div{padding:22px 18px;border-right:1px solid #1d2a20}.signal>div:last-child{border:0}.cap{font:700 10px ui-monospace,monospace;letter-spacing:.09em;color:#617068}.number{font:800 38px ui-monospace,monospace;margin:8px 0}.range{color:#267244}.summary{padding:15px 18px;border-bottom:1px solid #1d2a20}.section{border-bottom:1px solid #1d2a20}.section h2{margin:0;padding:13px 18px;font-size:15px;border-bottom:1px solid #1d2a20}.grid{display:grid;grid-template-columns:repeat(3,1fr)}#structure .grid{grid-template-columns:repeat(4,1fr)}.item{min-height:120px;padding:16px 18px;border-right:1px solid #d1d7cf;border-bottom:1px solid #d1d7cf}.item b{display:block;font-size:20px;margin:9px 0}.item small{color:#59665d}@media(max-width:720px){#structure .grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{display:flex;padding:0;border-bottom:1px solid #202920;overflow:auto}.side a{white-space:nowrap;padding:12px}.side a.on{padding-left:12px;border-left:0;border-bottom:3px solid #277445}.signal,.grid{grid-template-columns:1fr}.signal>div{border-right:0;border-bottom:1px solid #d1d7cf}}</style><body><header class="bar">VECTOR JPY <span class="meta">USD/JPY · MARKET OBSERVATION</span></header><div class="app"><aside class="side"><a class="on" href="index.html">概要</a><a href="trade.html">保有ポジション</a><a href="#momentum">モメンタム</a><a href="#structure">価格構造</a></aside><main class="main" id="app">読み込み中…</main></div><script>const A='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',f=s=>s.replaceAll('_',' ').toUpperCase(),a=n=>n>15?'↑':n<-15?'↓':'→';fetch(A).then(r=>r.json()).then(d=>{let g=k=>d.indicators.filter(x=>x.category===k).map(x=>`<article class="item"><span class="cap">${x.name}</span><b>${a(x.score)} ${x.displayValue}</b><div>${f(x.direction)}</div><small>${x.description}</small></article>`).join(''),name=k=>({momentum:'モメンタム',trend:'トレンド',structure:'価格構造',overextension:'過熱感',volatility:'ボラティリティ'})[k];app.innerHTML=`<div class="head">概要</div><section class="signal"><div><span class="cap">USD / JPY</span><div class="number">${d.quote.price.toFixed(3)}</div>${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} · ${d.quote.changePercent.toFixed(2)}%</div><div><span class="cap">現在の市場状態</span><div class="number range">${f(d.composite.regime)}</div>${d.composite.modifiers.map(f).join(' ・ ')}</div><div><span class="cap">総合スコア</span><div class="number">${d.composite.score>0?'+':''}${d.composite.score}</div>一致度 ${d.composite.confidence}%</div></section><div class="summary">${d.summary}</div>${['momentum','trend','structure','overextension','volatility'].map(k=>`<section class="section" id="${k}"><h2>${name(k)}</h2><div class="grid">${g(k)}</div></section>`).join('')}`}).catch(()=>app.textContent='市場データを取得できませんでした。')</script></body></html>

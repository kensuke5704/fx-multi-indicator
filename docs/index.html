<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USD/JPY 市場観測</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f0;color:#13251d;font:14px system-ui}.top{padding:16px max(20px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid #dbe0d9;font-weight:700}.nav{margin-left:25px;font-size:12px}.nav a{margin-right:16px;color:#68766e;text-decoration:none}.nav .on{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:6px}.wrap{max-width:1120px;margin:auto;padding:30px 20px}.hero{display:grid;grid-template-columns:1.15fr 1.4fr .7fr;gap:0;background:#153e31;color:#f5faef}.hero>div{padding:24px;border-right:1px solid #3c6053}.hero>div:last-child{border:0}.small{font-size:10px;letter-spacing:.1em;color:#93a99d}.price{font-size:48px;font-weight:750;margin:6px 0}.regime{font-size:29px;font-weight:800;margin:8px 0}.score{font-size:42px;font-weight:800}.summary{padding:18px 0;border-bottom:1px solid #dbe0d9;line-height:1.7}.section{margin-top:28px}.section h2{font-size:13px;margin:0 0 9px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#fff;border:1px solid #dbe0d9;padding:14px;border-top:3px solid #4ca87e}.card b{display:block;font-size:19px;margin:8px 0}.card small{color:#6d7a72}@media(max-width:700px){.hero,.cards{grid-template-columns:1fr}.hero>div{border-right:0;border-bottom:1px solid #3c6053}}</style><body><div class="top">USD/JPY 市場観測 <nav class="nav"><a class="on" href="index.html">市場の状態</a><a href="trade.html">保有ポジション</a></nav></div><main class="wrap" id="app">市場データを取得しています…</main><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',f=s=>s.replaceAll('_',' ').toUpperCase(),a=n=>n>15?'↑':n<-15?'↓':'→';fetch(API).then(r=>r.json()).then(d=>{let g=k=>d.indicators.filter(x=>x.category===k).map(x=>`<article class="card"><span class="small">${x.name}</span><b>${a(x.score)} ${x.displayValue}</b><small>${x.description}</small></article>`).join('');app.innerHTML=`<section class="hero"><div><span class="small">現在のレート</span><div class="price">${d.quote.price.toFixed(3)}</div>${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} (${d.quote.changePercent.toFixed(2)}%)</div><div><span class="small">4時間足の市場状態</span><div class="regime">${f(d.composite.regime)}</div>${d.composite.modifiers.map(f).join(' ・ ')}</div><div><span class="small">総合スコア</span><div class="score">${d.composite.score>0?'+':''}${d.composite.score}</div>一致度 ${d.composite.confidence}%</div></section><p class="summary">${d.summary}</p>${['momentum','trend','structure','overextension','volatility'].map(x=>`<section class="section"><h2>${x==='momentum'?'勢い':x==='trend'?'トレンド':x==='structure'?'価格構造（MSB・オーダーブロック）':x==='overextension'?'過熱感':'値動きの大きさ'}</h2><div class="cards">${g(x)}</div></section>`).join('')}`}).catch(()=>app.textContent='市場データを取得できませんでした。')</script></body></html>

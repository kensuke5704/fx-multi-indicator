<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY</title><style>body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui,sans-serif}.top{padding:18px max(20px,calc((100vw - 1180px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.muted{font-size:11px;color:#718078;letter-spacing:.08em}.hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;border-bottom:1px solid #ddd;padding-bottom:26px}.price{font-size:52px;font-weight:800;letter-spacing:-3px}.up{color:#147b51}.down{color:#bb533e}.regime{font-size:36px;font-weight:800;letter-spacing:-2px;color:#153e31;margin:8px 0}.score{font-size:44px;font-weight:800}.tf,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.box{background:#fcfcf9;border:1px solid #dfe1dc;padding:16px}.box b{display:block;font-size:17px;margin:7px 0}.cards{grid-template-columns:repeat(4,1fr)}.card{min-height:112px;border-top:3px solid #4ca87e}.card strong{font-size:21px}.card p{font-size:11px;color:#718078;margin:9px 0}.section{margin-top:29px}.error{color:#bb533e;margin-top:15px}@media(max-width:720px){.hero,.tf,.cards{grid-template-columns:1fr}.price{font-size:45px}}</style></head><body><div class="top">FX <span style="color:#91a098">/</span> Vector JPY <span class="muted" style="float:right">USDJPY MARKET STATE</span></div><main class="wrap"><div id="app"><p>Market data is loading…</p></div></main><script>const API="__API_URL__/api/market/USDJPY";const f=x=>x.replaceAll('_',' ').toUpperCase(),a=n=>n>15?'↑':n<-15?'↓':'→',c=n=>n>15?'up':n<-15?'down':'';async function load(){try{let d=await fetch(API).then(r=>r.ok?r.json():Promise.reject());let g=k=>d.indicators.filter(x=>x.category===k).map(x=>`<article class="box card ${c(x.score)}"><span class="muted">${x.name}</span><strong>${a(x.score)} ${x.displayValue}</strong><div>${f(x.direction)}</div><p>${x.description}</p></article>`).join('');app.innerHTML=`<section class="hero"><div><div class="muted">USD / JPY · SPOT FX</div><div class="price">${d.quote.price.toFixed(3)}</div><div class="${c(d.quote.change)}">${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} · ${d.quote.changePercent.toFixed(2)}%</div><p class="muted">Updated ${new Date(d.updatedAt).toLocaleTimeString('ja-JP')}</p></div><div><div class="muted">CURRENT REGIME · 4H FOCUS</div><div class="regime">${f(d.composite.regime)}</div><div>${d.composite.modifiers.map(f).join(' · ')}</div></div><div><div class="muted">TREND SCORE</div><div class="score ${c(d.composite.score)}">${d.composite.score>0?'+':''}${d.composite.score}<small>/100</small></div><div>Confidence <b>${d.composite.confidence}%</b></div></div></section><section class="tf">${d.timeframes.map(x=>`<div class="box ${c(x.score)}"><span class="muted">${x.timeframe}</span><b>${a(x.score)} ${f(x.direction)}</b>Score ${x.score}</div>`).join('')}</section><section class="section"><div class="muted">MARKET READ</div><p>${d.summary}</p></section><section class="section"><div class="muted">MOMENTUM</div><div class="cards">${g('momentum')}</div></section><section class="section"><div class="muted">TREND</div><div class="cards">${g('trend')}</div></section><section class="section"><div class="muted">MARKET STRUCTURE · MSB / ORDER BLOCK</div><div class="cards">${g('structure')}</div></section><section class="section"><div class="muted">OVEREXTENSION & VOLATILITY</div><div class="cards">${g('overextension')+g('volatility')}</div></section>`}catch(e){app.innerHTML='<p class="error">Market data is temporarily unavailable. Retrying…</p>'}}load();setInterval(load,15000);</script></body></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY</title><link rel="stylesheet" href="console.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui}.top{padding:17px max(20px,calc((100vw - 880px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.tabs{display:inline-flex;margin-left:26px;gap:12px;font-size:12px}.tabs a{color:#718078;text-decoration:none}.tabs .on{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}.wrap{max-width:880px;margin:auto;padding:28px 20px}.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.box{padding:18px;background:#fcfcf9;border:1px solid #dfe1dc}.interactive{cursor:pointer;transition:border-color .15s,background .15s}.interactive:hover{border-color:#6c8d7a;background:#f3f7f1}.interactive:focus-visible{outline:2px solid #277445;outline-offset:2px}.hero-tile{padding:14px 18px;border-top:4px solid #277445;background:#f7faf5}.hero-tile .price,.hero-tile .regime,.hero-tile.donchian strong{display:block;margin:8px 0;font-size:26px;line-height:30px;font-weight:800}.hero-tile.donchian strong{white-space:nowrap;letter-spacing:-.02em}.hero-tile .detail{min-height:15px;font-size:11px;line-height:15px}.label{font-size:10px;color:#718078;letter-spacing:.1em}.context{margin:10px 0 28px;color:#657268;font-size:12px}.cards{margin-top:10px}.card{border-top:3px solid #aab8af}.card.signal{border-top-color:#4ca87e}.card.structure{border-top-color:#277445;background:#f7faf5}.card strong{display:block;font-size:21px;margin:8px 0}.card .state{color:#657268;font-size:11px;letter-spacing:.06em}.section{margin-top:28px}dialog{width:min(560px,calc(100% - 32px));border:1px solid #bfc9c1;background:#fbfbf8;color:#14221d;padding:26px;box-shadow:0 20px 60px #14221d33}dialog::backdrop{background:#14221d66}.close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#526158;font-size:24px;cursor:pointer}.modal-value{margin:8px 0 20px;font-size:28px;font-weight:800;color:#153e31}.modal-block{margin-top:16px}.modal-block p{margin:6px 0;line-height:1.65}#position{display:none;min-height:calc(100vh - 54px)}#position iframe{width:100%;height:1120px;border:0;display:block}.position-mode #app{display:none}.position-mode #position{display:block}.position-mode #marketTab{color:#718078;border-bottom:0;padding-bottom:0}.position-mode #positionTab{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}@media(max-width:720px){.hero,.cards{grid-template-columns:1fr}.tabs{margin-left:12px}#position iframe{height:1180px}}</style><body><div class="top">FX / Vector JPY <nav class="tabs"><a class="on" href="#market" id="marketTab">MARKET</a><a href="#position" id="positionTab">POSITION P/L</a></nav></div><main class="wrap" id="app">Loading market data…</main><section id="position"><iframe src="trade.html?embed=1&amp;v=b828ad6" title="Position P/L"></iframe></section><dialog id="detail"><button class="close" aria-label="Close">×</button><div class="label" id="detailTitle"></div><div class="modal-value" id="detailValue"></div><div class="modal-block"><div class="label">WHAT IT MEANS</div><p id="detailMeaning"></p></div><div class="modal-block"><div class="label">HOW TO READ IT</div><p id="detailReading"></p></div><div class="modal-block"><div class="label">REFERENCE GUIDE</div><p id="detailGuide"></p></div></dialog><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',arrow=n=>n>15?'↑':n<-15?'↓':'→',title=s=>s.replaceAll('_',' ').toUpperCase(),stamp=x=>new Date(x||Date.now()).toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}),explain={'USD / JPY · SPOT FX':['USD/JPYの現在レートです。下段には直近の価格変化と変化率を示します。','レート上昇は円安・ドル高、低下は円高・ドル安を表します。変化率は直近比較です。'],'CURRENT REGIME':['複数指標をまとめた現在の相場状態です。','RANGEは方向感が弱く一定の値幅で推移している状態、TRENDは方向性が明確な状態を示します。'],'TREND SCORE':['モメンタム・トレンド・構造を合算した方向性のスコアです。','プラスは上方向、マイナスは下方向への傾きを示し、絶対値が大きいほど方向性が強い目安です。'],'Donchian 20':['直近20本（この画面では24時間相当）の高値・安値の範囲です。','IN RANGEは価格が直近レンジ内にある状態です。上限・下限を抜けた場合はレンジ外への変化として観測します。'],'Market Structure':['高値・安値の切り上げ・切り下げから価格構造を表します。','HH/HLは上昇構造、LH/LLは下降構造、Mixedは方向が混在している状態です。'],'MSB · Structure Break':['Market Structure Break。直近の重要な高値・安値を明確に抜けたかを示します。','MSBが確定すると、従来の構造が変化した可能性を観測します。未確定時はNo active MSBと表示されます。'],'Order Block':['構造ブレイク前の最後の反対方向の値動きから推定する価格帯です。','確定したMSBがある場合にのみ有効なゾーンとして表示します。No active zoneは条件未成立を意味します。'],'EMA Structure':['短中期EMAの並びと傾きです。','上向きに整列すれば上昇傾向、下向きに整列すれば下降傾向、Mixedは方向が揃っていない状態です。'],'Regression 48H':['過去48時間の回帰直線による価格の傾きと当てはまりです。','Slopeは時間あたりの価格変化、R²は直線傾向への当てはまりの強さを示します。'],'ADX / DI':['ADXはトレンドの強さ、+DIと−DIは上昇・下降方向の優勢度です。','ADXが高いほど方向性が強い目安です。+DIが−DIを上回ると上方向、逆なら下方向が優勢です。'],'6H Momentum':['直近6時間の価格変化率です。','短い時間軸の勢いを示します。プラスは上昇、マイナスは下落方向の変化です。'],'24H Momentum':['直近24時間の価格変化率です。','1日単位の勢いを確認します。短期値と合わせて方向性の継続性を観測します。'],'3D Momentum':['直近3営業日の価格変化率です。','短期ノイズを抑えた広めのモメンタムを確認します。'],'RSI 14':['14期間の上昇・下落バランスを0〜100で示すオシレーターです。','一般に70以上は買われ過ぎ、30以下は売られ過ぎの目安です。中間帯は均衡を表します。'],'Price Z-score':['価格が48時間平均からどの程度離れているかを標準偏差で表します。','プラスは平均より上、マイナスは平均より下です。絶対値が大きいほど平均からの乖離が大きい状態です。'],'ATR 14':['14期間の平均的な値動き幅です。','数値が大きいほど値動きが大きい状態です。パーセンタイルは過去の変動幅と比較した位置を示します。']},guide={'USD / JPY · SPOT FX':'USD/JPYでは0.01円がおおむね1 pipです。変化率は期間や流動性と合わせて確認します。','CURRENT REGIME':'単一の数値しきい値ではなく、各指標の組み合わせで判定します。','TREND SCORE':'±15未満は中立圏、+15超は上方向、−15未満は下方向への傾きの目安です。','Donchian 20':'上限を上抜く・下限を下抜くと、直近20本レンジからの変化として表示されます。','Market Structure':'HH/HLまたはLH/LLが連続して確認されると、構造の方向性が明確になります。','MSB · Structure Break':'直近スイングの高値・安値を終値ベースで明確に越えると、MSB候補として観測します。','Order Block':'確定MSBがない場合はゾーンを表示しません。価格帯の幅は直前の値動きにより変化します。','EMA Structure':'短期EMAが中長期EMAより上で上向きなら上方向、逆なら下方向の目安です。','Regression 48H':'R²が0に近いほど直線傾向は弱く、1に近いほど傾向への当てはまりが高くなります。','ADX / DI':'ADX 20未満は弱い傾向、20〜25は形成中、25超は明確な傾向の目安です。','6H Momentum':'0%付近は短期の変化が小さい状態です。絶対値が大きいほど直近の変化率が大きくなります。','24H Momentum':'0%付近は1日単位の変化が小さい状態です。短期値と符号が揃うかを確認します。','3D Momentum':'0%付近は3日単位の変化が小さい状態です。短期モメンタムとの方向一致を確認します。','RSI 14':'70以上は買われ過ぎ、30以下は売られ過ぎ、45〜55は中立圏の目安です。','Price Z-score':'±1σは平均から標準的な乖離、±2σ超は比較的大きな乖離の目安です。','ATR 14':'パーセンタイル30未満は低ボラティリティ、30〜70は標準、70超は高ボラティリティの目安です。'};fetch(API).then(r=>r.json()).then(d=>{let donchian=d.indicators.find(x=>x.name.includes('Donchian')),donchianValue=donchian.displayValue==='Inside Channel'?'IN RANGE':donchian.displayValue,cards=k=>d.indicators.filter(x=>x.category===k&&!x.name.includes('Donchian')).map(x=>{let active=x.direction!=='neutral',struct=k==='structure';return`<article class="box card interactive ${active?'signal':''} ${struct?'structure':''}" role="button" tabindex="0" data-key="${x.name}" data-value="${arrow(x.score)} ${x.displayValue}"><span class="label">${x.name}</span><strong>${arrow(x.score)} ${x.displayValue}</strong>${active?`<div class="state">${title(x.direction)}</div>`:''}<small>${x.description}</small></article>`}).join(''),updated=d.quote.updatedAt||d.updatedAt||d.quote.timestamp,section=(k,label,body)=>`<section class="section" data-category="${k}"><div class="label">${label||k.toUpperCase()}</div><div class="cards">${body??cards(k)}</div></section>`;app.innerHTML=`<section class="hero"><div class="box hero-tile interactive" role="button" tabindex="0" data-key="USD / JPY · SPOT FX" data-value="${d.quote.price.toFixed(3)}"><div class="label">USD / JPY · SPOT FX</div><div class="price">${d.quote.price.toFixed(3)}</div><div class="detail">${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} · ${d.quote.changePercent.toFixed(2)}%</div></div><div class="box hero-tile interactive" role="button" tabindex="0" data-key="CURRENT REGIME" data-value="${title(d.composite.regime)}"><div class="label">CURRENT REGIME</div><div class="regime">${title(d.composite.regime)}</div><div class="detail">${d.composite.modifiers.map(title).join(' · ')}</div></div><div class="box hero-tile score interactive" role="button" tabindex="0" data-key="TREND SCORE" data-value="${d.composite.score>0?'+':''}${d.composite.score}"><div class="label">TREND SCORE</div><div class="price">${d.composite.score>0?'+':''}${d.composite.score}</div><div class="detail">Confidence ${d.composite.confidence}%</div></div><div class="box hero-tile donchian interactive" role="button" tabindex="0" data-key="Donchian 20" data-value="${arrow(donchian.score)} ${donchianValue}"><div class="label">DONCHIAN · 24H</div><strong>${arrow(donchian.score)} ${donchianValue}</strong><div class="detail">24H range status</div></div></section><p>${d.summary}</p><div class="context">4H observation window · Yahoo Finance market data · Updated ${stamp(updated)}</div>${section('structure','STRUCTURE · MSB/OB')}${section('trend')}${section('momentum')}${section('mix','OVEREXTENSION · VOLATILITY',cards('overextension')+cards('volatility'))}`}).catch(()=>app.textContent='Market data is temporarily unavailable.');const modal=document.getElementById('detail'),mt=document.getElementById('detailTitle'),mv=document.getElementById('detailValue'),mm=document.getElementById('detailMeaning'),mr=document.getElementById('detailReading'),mg=document.getElementById('detailGuide');function showDetail(card){let info=explain[card.dataset.key]||['この指標は現在の市場状態を示します。','表示値と他の指標を合わせて、相場の状態を観測します。'];mt.textContent=card.dataset.key;mv.textContent=card.dataset.value;mm.textContent=info[0];mr.textContent=info[1];mg.textContent=guide[card.dataset.key]||'数値は直近の状態を示します。ほかの指標と合わせて変化の大きさを確認します。';modal.showModal()}document.addEventListener('click',e=>{let card=e.target.closest('.interactive');if(card)showDetail(card);if(e.target.closest('.close'))modal.close()});document.addEventListener('keydown',e=>{let card=e.target.closest('.interactive');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showDetail(card)}});function tab(){document.body.classList.toggle('position-mode',location.hash==='#position')}addEventListener('hashchange',tab);tab()</script></body></html>

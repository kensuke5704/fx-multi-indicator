<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY</title><style>body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui}.top{padding:17px max(20px,calc((100vw - 1180px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.tabs{display:inline-flex;margin-left:26px;gap:12px;font-size:12px}.tabs a{color:#718078;text-decoration:none}.tabs .on{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.hero,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.box{padding:18px;background:#fcfcf9;border:1px solid #dfe1dc}.price{font-size:52px;font-weight:800}.regime{font-size:32px;font-weight:800;color:#153e31}.label{font-size:10px;color:#718078;letter-spacing:.1em}.cards{grid-template-columns:repeat(4,1fr);margin-top:10px}.card{border-top:3px solid #4ca87e}.card strong{display:block;font-size:21px;margin:8px 0}.section{margin-top:28px}@media(max-width:720px){.hero,.cards{grid-template-columns:1fr}.tabs{margin-left:12px}}</style><body><div class="top">FX / Vector JPY <nav class="tabs"><a class="on" href="index.html">MARKET</a><a href="trade.html">POSITION P/L</a></nav></div><main class="wrap" id="app">Loading market data…</main><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',a=n=>n>15?'↑':n<-15?'↓':'→',f=s=>s.replaceAll('_',' ').toUpperCase();fetch(API).then(r=>r.json()).then(d=>{let g=k=>d.indicators.filter(x=>x.category===k).map(x=>`<article class="box card"><span class="label">${x.name}</span><strong>${a(x.score)} ${x.displayValue}</strong><div>${f(x.direction)}</div><small>${x.description}</small></article>`).join('');app.innerHTML=`<section class="hero"><div><div class="label">USD / JPY · SPOT FX</div><div class="price">${d.quote.price.toFixed(3)}</div><div>${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} · ${d.quote.changePercent.toFixed(2)}%</div></div><div><div class="label">CURRENT REGIME</div><div class="regime">${f(d.composite.regime)}</div><div>${d.composite.modifiers.map(f).join(' · ')}</div></div><div><div class="label">TREND SCORE</div><div class="price">${d.composite.score>0?'+':''}${d.composite.score}</div>Confidence ${d.composite.confidence}%</div></section><p>${d.summary}</p>${['momentum','trend','structure','overextension','volatility'].map(x=>`<section class="section"><div class="label">${x==='structure'?'MARKET STRUCTURE · MSB / ORDER BLOCK':x.toUpperCase()}</div><div class="cards">${g(x)}</div></section>`).join('')}`}).catch(()=>app.textContent='Market data is temporarily unavailable.')</script></body></html>

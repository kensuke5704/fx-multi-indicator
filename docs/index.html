<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui}.top{padding:17px max(20px,calc((100vw - 880px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.tabs{display:inline-flex;margin-left:26px;gap:12px;font-size:12px}.tabs a{color:#718078;text-decoration:none}.tabs .on{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}.wrap{max-width:880px;margin:auto;padding:28px 20px}.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.box{padding:18px;background:#fcfcf9;border:1px solid #dfe1dc}.hero-tile{padding:14px 18px;border-top:4px solid #277445;background:#f7faf5}.hero-tile .price,.hero-tile .regime,.hero-tile.donchian strong{display:block;margin:8px 0;font-size:26px;line-height:30px;font-weight:800}.hero-tile.donchian strong{white-space:nowrap;letter-spacing:-.02em}.hero-tile .detail{min-height:15px;font-size:11px;line-height:15px}.label{font-size:10px;color:#718078;letter-spacing:.1em}.context{margin:10px 0 28px;color:#657268;font-size:12px}.cards{margin-top:10px}.card{border-top:3px solid #aab8af}.card.signal{border-top-color:#4ca87e}.card.structure{border-top-color:#277445;background:#f7faf5}.card strong{display:block;font-size:21px;margin:8px 0}.card .state{color:#657268;font-size:11px;letter-spacing:.06em}.section{margin-top:28px}#position{display:none;min-height:calc(100vh - 54px)}#position iframe{width:100%;height:1120px;border:0;display:block}.position-mode #app{display:none}.position-mode #position{display:block}.position-mode #marketTab{color:#718078;border-bottom:0;padding-bottom:0}.position-mode #positionTab{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}@media(max-width:720px){.hero,.cards{grid-template-columns:1fr}.tabs{margin-left:12px}#position iframe{height:1180px}}</style><body><div class="top">FX / Vector JPY <nav class="tabs"><a class="on" href="#market" id="marketTab">MARKET</a><a href="#position" id="positionTab">POSITION P/L</a></nav></div><main class="wrap" id="app">Loading market data…</main><section id="position"><iframe src="trade.html?embed=1&amp;v=b828ad6" title="Position P/L"></iframe></section><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',arrow=n=>n>15?'↑':n<-15?'↓':'→',title=s=>s.replaceAll('_',' ').toUpperCase(),stamp=x=>new Date(x||Date.now()).toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});fetch(API).then(r=>r.json()).then(d=>{let donchian=d.indicators.find(x=>x.name.includes('Donchian')),donchianValue=donchian.displayValue==='Inside Channel'?'IN RANGE':donchian.displayValue,cards=k=>d.indicators.filter(x=>x.category===k&&!x.name.includes('Donchian')).map(x=>{let active=x.direction!=='neutral',struct=k==='structure';return`<article class="box card ${active?'signal':''} ${struct?'structure':''}"><span class="label">${x.name}</span><strong>${arrow(x.score)} ${x.displayValue}</strong>${active?`<div class="state">${title(x.direction)}</div>`:''}<small>${x.description}</small></article>`}).join(''),updated=d.quote.updatedAt||d.updatedAt||d.quote.timestamp,section=(k,label,body)=>`<section class="section" data-category="${k}"><div class="label">${label||k.toUpperCase()}</div><div class="cards">${body??cards(k)}</div></section>`;app.innerHTML=`<section class="hero"><div class="box hero-tile"><div class="label">USD / JPY · SPOT FX</div><div class="price">${d.quote.price.toFixed(3)}</div><div class="detail">${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} · ${d.quote.changePercent.toFixed(2)}%</div></div><div class="box hero-tile"><div class="label">CURRENT REGIME</div><div class="regime">${title(d.composite.regime)}</div><div class="detail">${d.composite.modifiers.map(title).join(' · ')}</div></div><div class="box hero-tile score"><div class="label">TREND SCORE</div><div class="price">${d.composite.score>0?'+':''}${d.composite.score}</div><div class="detail">Confidence ${d.composite.confidence}%</div></div><div class="box hero-tile donchian"><div class="label">DONCHIAN · 24H</div><strong>${arrow(donchian.score)} ${donchianValue}</strong><div class="detail">24H range status</div></div></section><p>${d.summary}</p><div class="context">4H observation window · Yahoo Finance market data · Updated ${stamp(updated)}</div>${section('structure','STRUCTURE · MSB/OB')}${section('trend')}${section('momentum')}${section('mix','OVEREXTENSION · VOLATILITY',cards('overextension')+cards('volatility'))}`}).catch(()=>app.textContent='Market data is temporarily unavailable.');function tab(){document.body.classList.toggle('position-mode',location.hash==='#position')}addEventListener('hashchange',tab);tab()</script></body></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USD/JPY 市場観測</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#16241e;font:14px system-ui}.top{height:58px;padding:0 max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:28px;background:#0d120f;color:#f4f6ed;font-weight:800}.top a{font-size:12px;color:#cbd3cb;text-decoration:none}.top a.on{color:#fff;border-bottom:2px solid #5b9a70;padding:20px 0 16px}.wrap{max-width:1120px;margin:auto;padding:16px 20px 24px}.hero{display:grid;grid-template-columns:1.1fr 1.5fr .7fr;background:#fbfbf7;border:1px solid #cfd5cd}.hero>div{padding:17px 18px;border-right:1px solid #cfd5cd}.hero>div:last-child{border:0}.cap{font-size:10px;letter-spacing:.1em;color:#62726a}.price{font:700 42px ui-monospace,monospace;margin:5px 0}.regime{font-size:24px;font-weight:800;margin:7px 0;color:#21613c}.score{font:700 34px ui-monospace,monospace;margin:5px 0}.summary{margin:0;padding:13px 2px;border-bottom:1px solid #cfd5cd;line-height:1.6}.section{margin-top:18px}.section h2{font-size:13px;margin:0 0 7px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{background:#fbfbf7;border:1px solid #cfd5cd;border-top:3px solid #4ca87e;padding:11px;min-height:105px}.card b{display:block;font-size:17px;margin:7px 0}.card small{font-size:11px;color:#6d7a72;line-height:1.35}@media(max-width:700px){.hero,.cards{grid-template-columns:1fr}.hero>div{border-right:0;border-bottom:1px solid #cfd5cd}.wrap{padding:12px}.top{gap:16px}}</style><body><header class="top">USD/JPY <a class="on" href="index.html">市場の状態</a><a href="trade.html">保有ポジション</a></header><main class="wrap" id="app">市場データを取得しています…</main><script>const A='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/market/USDJPY',f=s=>s.replaceAll('_',' ').toUpperCase(),a=n=>n>15?'↑':n<-15?'↓':'→';fetch(A).then(r=>r.json()).then(d=>{let g=k=>d.indicators.filter(x=>x.category===k).map(x=>`<article class="card"><span class="cap">${x.name}</span><b>${a(x.score)} ${x.displayValue}</b><small>${x.description}</small></article>`).join('');app.innerHTML=`<section class="hero"><div><span class="cap">現在のレート</span><div class="price">${d.quote.price.toFixed(3)}</div>${d.quote.change>=0?'+':''}${d.quote.change.toFixed(3)} (${d.quote.changePercent.toFixed(2)}%)</div><div><span class="cap">4時間足の市場状態</span><div class="regime">${f(d.composite.regime)}</div>${d.composite.modifiers.map(f).join(' ・ ')}</div><div><span class="cap">総合スコア</span><div class="score">${d.composite.score>0?'+':''}${d.composite.score}</div>一致度 ${d.composite.confidence}%</div></section><p class="summary">${d.summary}</p>${['momentum','trend','structure','overextension','volatility'].map(x=>`<section class="section"><h2>${x==='momentum'?'勢い':x==='trend'?'トレンド':x==='structure'?'価格構造（MSB・オーダーブロック）':x==='overextension'?'過熱感':'値動きの大きさ'}</h2><div class="cards">${g(x)}</div></section>`).join('')}`}).catch(()=>app.textContent='市場データを取得できませんでした。')</script></body></html>

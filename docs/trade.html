<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY · Position</title><style>body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui}.top{padding:17px max(20px,calc((100vw - 1180px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.tabs{display:inline-flex;margin-left:26px;gap:12px;font-size:12px}.tabs a{color:#718078;text-decoration:none}.tabs .on{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.box{background:#fcfcf9;border:1px solid #dfe1dc;padding:18px}.label{font-size:10px;color:#718078;letter-spacing:.1em}.field{margin-top:16px}.field label{display:block;font-size:11px;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #cfd6d0;background:white;font:15px system-ui}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.result b{display:block;font-size:26px;margin-top:6px}.up{color:#147b51}.down{color:#bb533e}.chart{height:300px;background:#f8faf6;padding:12px}.chart svg{width:100%;height:270px}.line{fill:none;stroke:#1b7954;stroke-width:2}.zero{stroke:#c9cec8;stroke-dasharray:4 4}.note{font-size:11px;color:#718078;line-height:1.6;margin-top:18px}@media(max-width:760px){.grid,.result{grid-template-columns:1fr}.tabs{margin-left:12px}}</style><body><div class="top">FX / Vector JPY <nav class="tabs"><a href="index.html">MARKET</a><a class="on" href="trade.html">POSITION P/L</a></nav></div><main class="wrap"><p class="label">USD/JPY · UNREALISED P/L SIMULATOR</p><div class="grid"><aside class="box"><div class="label">POSITION INPUT</div><div class="field"><label>売買方向</label><select id="side"><option value="long">買い（Long）</option><option value="short">売り（Short）</option></select></div><div class="field"><label>エントリー価格（USD/JPY）</label><input id="entry" type="number" step="0.001" value="150.000"></div><div class="field"><label>Lot数（1 Lot = 100,000 USD）</label><input id="lot" type="number" min="0.01" step="0.01" value="0.10"></div><div class="field"><label>目標含み益（JPY）</label><input id="target" type="number" step="1000" value="50000"></div><p class="note">日足終値ベースの試算です。スワップ・手数料・スプレッドは含みません。</p></aside><section><div class="result"><div class="box"><span class="label">LATEST CLOSE</span><b id="close">—</b></div><div class="box"><span class="label">UNREALISED P/L</span><b id="pnl">—</b></div><div class="box"><span class="label">TARGET RATE</span><b id="rate">—</b><small id="rateNote"></small></div></div><div class="box"><div class="label">UNREALISED P/L · DAILY CLOSE HISTORY</div><div class="chart"><svg id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg></div><div class="note" id="range">Loading daily history…</div></div></section></div></main><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/history/USDJPY',yen=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0});let candles=[];const $=id=>document.getElementById(id),inputs=['side','entry','lot','target'];function draw(){if(!candles.length)return;let e=+$('entry').value,l=+$('lot').value,t=+$('target').value,sg=$('side').value==='long'?1:-1,unit=l*100000,vals=candles.map(x=>({time:x.time,v:(x.close-e)*unit*sg})),last=vals.at(-1).v,goal=e+sg*t/unit,lo=Math.min(...vals.map(x=>x.v),0),hi=Math.max(...vals.map(x=>x.v),0),r=hi-lo||1,path=vals.map((x,i)=>`${i?'L':'M'}${i/(vals.length-1)*1000} ${270-(x.v-lo)/r*240}`).join(' '),zero=270-(0-lo)/r*240;$('close').textContent=candles.at(-1).close.toFixed(3);$('pnl').textContent=(last>=0?'+':'')+yen.format(last)+' JPY';$('pnl').className=last>=0?'up':'down';$('rate').textContent=goal.toFixed(3);$('rateNote').textContent=`${yen.format(t)} JPY の含み益目標`;$('chart').innerHTML=`<line class="zero" x1="0" y1="${zero}" x2="1000" y2="${zero}"/><path class="line" d="${path}"/>`;$('range').textContent=`${new Date(candles[0].time).toLocaleDateString('ja-JP')} 〜 ${new Date(candles.at(-1).time).toLocaleDateString('ja-JP')} の日足終値 · ${vals.length}営業日`;}inputs.forEach(x=>$(x).addEventListener('input',draw));fetch(API).then(r=>r.json()).then(d=>{candles=d.candles;draw()}).catch(()=>$('range').textContent='日足履歴を取得できませんでした。');</script></body></html>

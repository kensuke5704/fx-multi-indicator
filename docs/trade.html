<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector JPY · Position</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#14221d;font:14px system-ui}.top{padding:17px max(20px,calc((100vw - 1180px)/2));background:#fbfbf8;border-bottom:1px solid #ddd;font-weight:800}.tabs{display:inline-flex;margin-left:26px;gap:12px;font-size:12px}.tabs a{color:#718078;text-decoration:none}.tabs .on{color:#153e31;border-bottom:2px solid #153e31;padding-bottom:5px}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}.box{min-width:0;background:#fcfcf9;border:1px solid #dfe1dc;padding:18px}.label{font-size:10px;color:#718078;letter-spacing:.1em}.field{margin-top:16px}.field label{display:block;font-size:11px;margin-bottom:6px}input,select{width:100%;padding:10px;border:1px solid #cfd6d0;background:#fff;font:15px system-ui}.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}.result b{display:block;font-size:26px;margin-top:6px;overflow-wrap:anywhere}.up{color:#147b51}.down{color:#bb533e}.chart{height:320px;background:#f8faf6;padding:8px}.chart svg{width:100%;height:300px}.line{fill:none;stroke:#1b7954;stroke-width:2}.zero,.gridline{stroke:#c9cec8;stroke-dasharray:4 4}.axis{fill:#718078;font-size:18px}.note{font-size:11px;color:#718078;line-height:1.6;margin-top:18px}@media(max-width:760px){.grid,.result{grid-template-columns:1fr}.tabs{margin-left:12px}.wrap{padding:20px 12px}}</style><body><div class="top">FX / Vector JPY <nav class="tabs"><a href="index.html">MARKET</a><a class="on" href="trade.html">POSITION P/L</a></nav></div><main class="wrap"><p class="label">USD/JPY · UNREALISED P/L SIMULATOR</p><div class="grid"><aside class="box"><div class="label">POSITION INPUT</div><div class="field"><label>売買方向</label><select id="side"><option value="long">買い（Long）</option><option value="short">売り（Short）</option></select></div><div class="field"><label>エントリー価格（USD/JPY）</label><input id="entry" type="number" step="0.001" value="150.000"></div><div class="field"><label>Lot数（1 Lot = 10,000 USD）</label><input id="lot" type="number" min="0.01" step="0.01" value="0.10"></div><div class="field"><label>目標含み益（JPY）</label><input id="target" inputmode="numeric" value="50,000"></div><div class="field"><label>1日あたりのスワップ（1 Lotあたり・JPY）</label><input id="swap" type="number" step="1" value="0"></div><div class="field"><label>グラフ開始日</label><input id="start" type="date"></div><p class="note">日足終値と日次スワップでの試算です。スプレッド・手数料は含みません。</p></aside><section><div class="result"><div class="box"><span class="label">LATEST CLOSE</span><b id="close">—</b></div><div class="box"><span class="label">UNREALISED P/L · SWAP INCL.</span><b id="pnl">—</b><small id="swapTotal"></small></div><div class="box"><span class="label">TARGET RATE</span><b id="rate">—</b><small id="rateNote"></small></div></div><div class="box"><div class="label">UNREALISED P/L · DAILY CLOSE HISTORY</div><div class="chart"><svg id="chart" viewBox="0 0 1000 340" preserveAspectRatio="none"></svg></div><div class="note" id="range">Loading daily history…</div></div></section></div></main><script>const API='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/history/USDJPY',yen=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0}),$=x=>document.getElementById(x),num=x=>+x.replaceAll(',','');let all=[];function draw(){if(!all.length)return;let e=+$('entry').value,l=+$('lot').value,t=num($('target').value),sw=+$('swap').value,sg=$('side').value==='long'?1:-1,st=$('start').value?new Date($('start').value).getTime():all[0].time,cs=all.filter(x=>x.time>=st);if(!cs.length)cs=all;let u=l*10000,v=cs.map(x=>{let d=Math.max(0,Math.floor((x.time-cs[0].time)/864e5));return{time:x.time,p:(x.close-e)*u*sg+d*sw*l}}),last=v.at(-1),days=Math.floor((last.time-cs[0].time)/864e5),swap=days*sw*l,goal=e+sg*(t-swap)/u,lo=Math.min(...v.map(x=>x.p),0),hi=Math.max(...v.map(x=>x.p),0),r=hi-lo||1,y=x=>290-(x-lo)/r*250,X=i=>70+i/(v.length-1)*900,path=v.map((q,i)=>`${i?'L':'M'}${X(i)} ${y(q.p)}`).join(' '),ticks=[lo,lo+r/4,lo+r/2,lo+r*.75,hi],lines=ticks.map(x=>`<line class="gridline" x1="70" y1="${y(x)}" x2="970" y2="${y(x)}"/><text class="axis" x="0" y="${y(x)+6}">${yen.format(x)}</text>`).join(''),dt=x=>new Date(x).toLocaleDateString('ja-JP');$('close').textContent=cs.at(-1).close.toFixed(3);$('pnl').textContent=(last.p>=0?'+':'')+yen.format(last.p)+' JPY';$('pnl').className=last.p>=0?'up':'down';$('swapTotal').textContent=`うちスワップ ${sw>=0?'+':''}${yen.format(swap)} JPY（${days}日）`;$('rate').textContent=goal.toFixed(3);$('rateNote').textContent=`${yen.format(t)} JPY の含み益目標（累積スワップ考慮）`;$('chart').innerHTML=`${lines}<line class="zero" x1="70" y1="${y(0)}" x2="970" y2="${y(0)}"/><path class="line" d="${path}"/><text class="axis" x="70" y="326">${dt(cs[0].time)}</text><text class="axis" text-anchor="end" x="970" y="326">${dt(last.time)}</text>`;$('range').textContent=`${dt(cs[0].time)} 〜 ${dt(last.time)} の日足終値 · ${v.length}営業日`;}['side','entry','lot','swap','start'].forEach(x=>$(x).oninput=draw);$('target').oninput=e=>{let p=e.target.selectionStart,n=e.target.value.replace(/\D/g,'');e.target.value=n?yen.format(n):'';e.target.setSelectionRange(p,p);draw()};fetch(API).then(r=>r.json()).then(d=>{all=d.candles;let p=new Date(all.at(-1).time);p.setMonth(p.getMonth()-3);$('start').value=p.toISOString().slice(0,10);draw()}).catch(()=>$('range').textContent='日足履歴を取得できませんでした。')</script></body></html>

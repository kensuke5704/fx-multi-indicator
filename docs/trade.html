<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保有ポジション | USD/JPY</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#16241e;font:14px system-ui}.top{height:58px;padding:0 max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:28px;background:#0d120f;color:#f4f6ed;font-weight:800}.top a{font-size:12px;color:#cbd3cb;text-decoration:none}.top a.on{color:#fff;border-bottom:2px solid #5b9a70;padding:20px 0 16px}.wrap{max-width:1120px;margin:auto;padding:28px 20px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.panel{background:#fbfbf7;border:1px solid #cfd5cd}.form{padding:18px}.cap{font-size:10px;font-weight:700;letter-spacing:.1em;color:#62726a}.field{margin-top:15px}.field label{display:block;font-size:12px;margin-bottom:6px}input,select{width:100%;padding:9px 10px;border:1px solid #bdc7be;background:white;font:14px system-ui}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #cfd5cd}.stat{padding:16px;border-right:1px solid #cfd5cd}.stat:last-child{border:0}.stat b{display:block;font:700 28px ui-monospace,monospace;margin-top:7px}.chart-head{padding:16px;border-bottom:1px solid #1b2b22;font-weight:700}.chart{padding:14px 10px 4px;height:300px}.chart svg{width:100%;height:270px;display:block}.gridline{stroke:#cbd2c9;stroke-dasharray:2 5}.zero{stroke:#75877c}.line{fill:none;stroke:#296f45;stroke-width:2.5}.axis{fill:#56645b;font:12px ui-monospace,monospace}.foot{padding:0 16px 15px;color:#718078;font-size:11px}@media(max-width:720px){.layout,.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid #cfd5cd}.top{gap:16px}.wrap{padding:18px 12px}}</style><body><header class="top">USD/JPY <a href="index.html">市場の状態</a><a class="on" href="trade.html">保有ポジション</a></header><main class="wrap"><p class="cap">日足終値にもとづく損益推移</p><div class="layout"><aside class="panel form"><div class="cap">ポジション条件</div><div class="field"><label>売買方向</label><select id="side"><option value="long">買い</option><option value="short">売り</option></select></div><div class="field"><label>エントリー価格</label><input id="entry" type="number" value="150.000" step=".001"></div><div class="field"><label>Lot数（1 Lot = 10,000 USD）</label><input id="lot" type="number" value=".10" step=".01"></div><div class="field"><label>目標含み益（JPY）</label><input id="target" value="50,000" inputmode="numeric"></div><div class="field"><label>日次スワップ（1 Lotあたり・JPY）</label><input id="swap" type="number" value="0"></div><div class="field"><label>開始日</label><input id="start" type="date"></div></aside><section class="panel"><div class="stats"><div class="stat"><span class="cap">最新終値</span><b id="close">—</b></div><div class="stat"><span class="cap">含み損益</span><b id="pnl">—</b></div><div class="stat"><span class="cap">目標レート</span><b id="rate">—</b></div></div><div class="chart-head">含み損益の推移</div><div class="chart"><svg id="chart" viewBox="0 0 1000 290" preserveAspectRatio="none"></svg></div><div class="foot" id="range">データを取得しています…</div></section></div></main><script>const A='https://vector-jpy-trend.kensuke5704.chatgpt.site/api/history/USDJPY',$=x=>document.getElementById(x),yen=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0});let C=[];let n=x=>+x.replaceAll(',','');let nice=x=>{let e=10**Math.floor(Math.log10(x||1)),f=x/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e};function draw(){if(!C.length)return;let e=+$('entry').value,l=+$('lot').value,t=n($('target').value),s=+$('swap').value,sg=$('side').value==='long'?1:-1,st=$('start').value?new Date($('start').value).getTime():C[0].time,c=C.filter(x=>x.time>=st);if(!c.length)c=C;let u=l*1e4,v=c.map(x=>{let d=Math.floor((x.time-c[0].time)/864e5);return{t:x.time,p:(x.close-e)*u*sg+d*s*l}}),z=v.at(-1),days=Math.floor((z.t-c[0].time)/864e5),lo0=Math.min(0,...v.map(x=>x.p)),hi0=Math.max(0,...v.map(x=>x.p)),step=nice((hi0-lo0)/4),lo=Math.floor(lo0/step)*step,hi=Math.ceil(hi0/step)*step,y=x=>250-(x-lo)/(hi-lo||step)*210,X=i=>100+i/(v.length-1)*870,path=v.map((x,i)=>`${i?'L':'M'}${X(i)} ${y(x.p)}`).join(' '),ticks=Array.from({length:Math.round((hi-lo)/step)+1},(_,i)=>lo+i*step),lines=ticks.map(x=>`<line class="gridline" x1="100" y1="${y(x)}" x2="970" y2="${y(x)}"/><text class="axis" text-anchor="end" x="90" y="${y(x)+4}">${yen.format(x)}</text>`).join(''),dt=x=>new Date(x).toLocaleDateString('ja-JP');$('close').textContent=c.at(-1).close.toFixed(3);$('pnl').textContent=(z.p>=0?'+':'')+yen.format(z.p);$('rate').textContent=(e+sg*(t-days*s*l)/u).toFixed(3);$('chart').innerHTML=`${lines}<line class="zero" x1="100" y1="${y(0)}" x2="970" y2="${y(0)}"/><path class="line" d="${path}"/><text class="axis" x="100" y="275">${dt(c[0].time)}</text><text class="axis" text-anchor="end" x="970" y="275">${dt(z.t)}</text>`;$('range').textContent=`${dt(c[0].time)} 〜 ${dt(z.t)} · ${v.length}営業日`; }['side','entry','lot','swap','start'].forEach(x=>$(x).oninput=draw);$('target').oninput=e=>{let q=e.target.value.replace(/\D/g,'');e.target.value=q?yen.format(q):'';draw()};fetch(A).then(r=>r.json()).then(d=>{C=d.candles;let q=new Date(C.at(-1).time);q.setMonth(q.getMonth()-3);$('start').value=q.toISOString().slice(0,10);draw()});</script></body></html>
